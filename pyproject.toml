[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quevidkit"
version = "1.0.1"
description = "Forensic video tampering detection toolkit with web UI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "quevidkit contributors"}
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[project.scripts]
qvk = "quevidkit.cli:main"
qvk-web = "quevidkit.webapp:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quevidkit = ["templates/*.html", "static/*.css", "static/*.js"]
